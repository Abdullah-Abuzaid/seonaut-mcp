name: CI

# main and version tags are tested by release.yml (which calls this workflow) before an image is built.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      seonaut_image:
        description: "SEOnaut image to test against. Empty = the pinned one in e2e/docker-compose.yml"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration"

  e2e:
    runs-on: ubuntu-latest
    env:
      SEONAUT_IMAGE: ${{ inputs.seonaut_image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Start SEOnaut, MySQL, test site and seonaut-mcp
        run: |
          mkdir -p e2e/.site && cp e2e/site/* e2e/.site/
          docker compose -f e2e/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Seed users, project and two crawls
        run: python e2e/seed.py
      - name: End-to-end tests
        run: pytest -m integration -v
      - name: Logs
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v
